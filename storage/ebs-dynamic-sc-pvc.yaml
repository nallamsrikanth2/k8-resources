apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  storageClassName: "ebs-dynamic" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-dynamic
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
kind: Pod
apiVersion: v1
metadata:
  labels:
    name: nginx
    project: some-project
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1f
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic
---
  kind: Service
  apiVersion: v1
  metadata:
    name: nginx
  spec:
    type: LoadBalancer
    selector:
      name: nginx
      project: some-project
    ports:
      protocol: TCP
      port: 80
      targetPort: 80
    

  
