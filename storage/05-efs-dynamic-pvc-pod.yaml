apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic-claim
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-dynamic
  resources:
    requests:
      storage: 5Gi
---
kind: Pod
apiVersion: v1
metadata:
  name: nginx
  labels:
    name: nginx
    tier: nginx
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: efs-dynamic-claim

---
kind: Service
apiVersion: v1
metadata:
  name: efs-dynamic
spec:
  selector:
    name: nginx
    tier: nginx
  ports:
  - protocol: TCP
    port: 80
    protocol: 80
