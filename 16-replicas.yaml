apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  labels:
  # this labels belongs to replicaset resources
    app: nginx
    tier: frontend
spec:
# modify replicas according to your case
  replicas: 3
  selector: 
    matchLabels:
      app: nginx
      tier: frontend
  template:
    metadata:
      labels:
        app: nginx
        tier: frontend
        project: some-project
    spec:
      containers:
      - name: nginx
        image: nginx


  

